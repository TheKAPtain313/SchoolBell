name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build watch app
        run: |
          set -o pipefail
          xcodebuild -project SchoolBell.xcodeproj \
            -target SchoolBellWatch \
            -sdk watchos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee watch-build.log

      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project SchoolBell.xcodeproj \
            -target SchoolBell \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee phone-build.log

      - name: Package IPA (watch app inside iPhone app)
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SchoolBell.app Payload/
          mkdir -p Payload/SchoolBell.app/Watch
          cp -R build/Release-watchos/SchoolBellWatch.app Payload/SchoolBell.app/Watch/
          zip -qry SchoolBell.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SchoolBell-ipa
          path: SchoolBell.ipa

      - name: SHOW ERRORS (screenshot this if the build failed)
        if: failure()
        run: |
          echo "===== FILES IN REPO ====="
          find . -path ./.git -prune -o -type f -print | grep -v "^./build/" | sort
          echo "===== ERRORS ====="
          grep -h "error:" *.log 2>/dev/null | sort -u | head -40 || echo "No build log. The failure was before the build step; check the red step above."
